<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Checklist</title>
<style>
:root { --bg:#f4f6f6; --paper:#fff; --ink:#18292c; --muted:#5d6f72; --rule:#d5dfe0; --accent:#1f6b74; --late:#b3261e }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1a1c; --paper:#162427; --ink:#e3ecec; --muted:#94a8ab; --rule:#2a3d40; --accent:#6cc0c8; --late:#ff8a80 } }
* { box-sizing: border-box }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font: 15px/1.45 "Helvetica Neue", Arial, sans-serif; padding:16px }
form { background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:24px 26px; width:min(380px,100%); display:grid; gap:10px }
h1 { margin:0 0 4px; font-size:19px; color:var(--accent) }
label { font-size:13px; color:var(--muted) }
input[type=password] { font:inherit; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink) }
.chk { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink) }
button { font:inherit; font-weight:600; padding:8px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--paper); cursor:pointer }
.err { color:var(--late); font-size:13px; min-height:1em; margin:0 }
</style></head><body>
